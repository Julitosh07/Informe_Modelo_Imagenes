<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconocedor MNIST — Web Service con IA</title>
    <!-- Fuente moderna Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Estilos externos (Paleta Vinotinto y Beige) -->
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>


    <div class="app-wrapper">
        <!-- Encabezado Principal -->
        <header class="header-hero">
            <h1>Reconocedor de <span class="highlight">Números</span> con IA</h1>
            <p>Sube una imagen de un número del 0 al 9 y descubre cuál es.</p>
            <div class="title-line"></div>
        </header>

        <!-- Grilla Principal en 2 Columnas -->
        <main class="main-grid">
            <!-- COLUMNA IZQUIERDA: Tarjeta 1 - Entrada del Dígito -->
            <section class="boceto-card">
                <div class="card-title-row">
                    <span class="badge-num">1</span>
                    <h2>Entrada del Dígito</h2>
                </div>

                <form id="formulario">
                    <!-- Zona de Arrastrar y Soltar / Subir Imagen -->
                    <div class="dropzone-box" id="dropzoneBox">
                        <input type="file" id="inputImagen" accept="image/*" required>

                        <!-- Estado Inicial: Solicitud de Carga -->
                        <div class="upload-idle-state" id="uploadIdleState">
                            <div class="image-icon-placeholder">
                                <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                    <rect width="18" height="18" x="3" y="3" rx="4"/>
                                    <circle cx="8.5" cy="8.5" r="1.5"/>
                                    <path d="m21 15-5-5L5 21"/>
                                </svg>
                            </div>
                            <span class="drop-title">Arrastra una imagen aquí</span>
                            <span class="drop-separator">o</span>
                            <div class="btn-select-file">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
                                </svg>
                                <span>Seleccionar Archivo</span>
                            </div>
                        </div>

                        <!-- Estado con Imagen Seleccionada: Previsualización -->
                        <div class="preview-container" id="previewContainer">
                            <div class="preview-img-frame">
                                <img id="previewImg" alt="Vista previa del número">
                            </div>
                            <button type="button" class="btn-change-file" id="btnCambiarImagen">
                                Seleccionar otra imagen
                            </button>
                        </div>
                    </div>

                    <!-- Botón Principal "Analizar Imagen" -->
                    <button type="submit" id="btnEnviar" class="btn-analizar">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <span>Analizar Imagen</span>
                    </button>

                    <div id="mensajeAlerta"></div>
                </form>
            </section>

            <!-- COLUMNA DERECHA: Tarjeta 2 - Resultado e Historial -->
            <div class="right-column">
                <!-- Tarjeta 2: Resultado -->
                <section class="boceto-card">
                    <div class="card-title-row">
                        <span class="badge-num">2</span>
                        <h2>Resultado</h2>
                    </div>

                    <div class="resultado-box">
                        <div class="resultado-split">
                            <!-- Recuadro Izquierdo con la Miniatura del Número -->
                            <div class="resultado-thumb-card">
                                <img id="resThumbImg" style="display: none;" alt="Número analizado">
                                <div id="resThumbPlaceholder" class="placeholder-icon">
                                    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <rect width="18" height="18" x="3" y="3" rx="3"/>
                                        <circle cx="9" cy="9" r="1.5"/>
                                        <path d="m21 15-5-5L5 21"/>
                                    </svg>
                                </div>
                            </div>

                            <!-- Información de la Predicción -->
                            <div class="resultado-info">
                                <span class="resultado-label">Número Identificado</span>
                                <div class="resultado-numero-grande" id="resNumeroGrande">—</div>
                            </div>
                        </div>

                        <!-- Sección: Nivel de Confianza -->
                        <div class="confianza-section">
                            <div class="confianza-header">
                                <span>Nivel de Confianza</span>
                                <span class="confianza-porcentaje" id="resConfianzaTexto">0.0%</span>
                            </div>
                            <div class="confianza-track">
                                <div class="confianza-fill" id="resConfianzaBarra"></div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Tarjeta Historial Reciente -->
                <section class="historial-card">
                    <div class="historial-header-row">
                        <div class="historial-title-group">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <polyline points="12 6 12 12 16 14"/>
                            </svg>
                            <h3>Historial Reciente</h3>
                        </div>
                        <button type="button" class="btn-clear-history" id="btnClearHistory">
                            Borrar historial
                        </button>
                    </div>

                    <div class="historial-list" id="historialLista">
                        <div class="historial-empty" id="historialEmpty">
                            Aún no se han realizado análisis en esta sesión.
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Script externo -->
    <script src="static/script.js"></script>
</body>
</html>
